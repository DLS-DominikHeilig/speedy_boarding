<style>
  :root {
    /* Hauptfarben (aus den Trainer-Hintergründen, geschätzt) */
    --yellow: #F5C451; --petrol: #1B7A6A; --red: #F2284B; --blue: #6B9EF7;
    /* Basis (von school.digitale-leute.de) */
    --teal: #02F3DA; --text: #222222; --muted: #4F4F4F; --soft: #7F7F7F;
    --bg: #F8F8F8; --dot: #E3E3E3; --card: #FFFFFF; --line: #E8E8E8; --dark: #222222;
    --radius: 14px; --shadow: 0 2px 16px rgba(0,0,0,.07); --shadow-lg: 0 10px 40px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 16px/1.6 Manrope, Arial, sans-serif; color: var(--text);
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 16px 16px;
    min-height: 100vh;
  }
  a { color: var(--petrol); font-weight: 700; }
  button { font: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .anim { display: block; }
  .pixel { image-rendering: pixelated; shape-rendering: crispEdges; display: block; }

  /* ---------- Buttons & Bausteine ---------- */
  .btn { display: inline-block; border: 0; cursor: pointer; border-radius: 10px; padding: 14px 22px; font-weight: 700; font-size: 1rem; text-decoration: none; transition: transform .1s, box-shadow .2s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--teal); color: var(--dark); box-shadow: 0 4px 0 #00b9a6; }
  .btn-primary:hover { box-shadow: 0 6px 0 #00b9a6; transform: translateY(-1px); }
  /* Pixel-Shine beim Hover */
  .btn-primary { position: relative; overflow: hidden; }
  .btn-primary::after { content: ""; position: absolute; top: 0; left: -64px; width: 4px; height: 4px; background: transparent; pointer-events: none; opacity: 0;
    box-shadow: 24px 0px rgba(255,255,255,0.8), 28px 0px rgba(255,255,255,0.8), 36px 0px rgba(255,255,255,0.5), 24px 4px rgba(255,255,255,0.8), 28px 4px rgba(255,255,255,0.8), 36px 4px rgba(255,255,255,0.5), 20px 8px rgba(255,255,255,0.8), 24px 8px rgba(255,255,255,0.8), 32px 8px rgba(255,255,255,0.5), 20px 12px rgba(255,255,255,0.8), 24px 12px rgba(255,255,255,0.8), 32px 12px rgba(255,255,255,0.5), 16px 16px rgba(255,255,255,0.8), 20px 16px rgba(255,255,255,0.8), 28px 16px rgba(255,255,255,0.5), 16px 20px rgba(255,255,255,0.8), 20px 20px rgba(255,255,255,0.8), 28px 20px rgba(255,255,255,0.5), 12px 24px rgba(255,255,255,0.8), 16px 24px rgba(255,255,255,0.8), 24px 24px rgba(255,255,255,0.5), 12px 28px rgba(255,255,255,0.8), 16px 28px rgba(255,255,255,0.8), 24px 28px rgba(255,255,255,0.5), 8px 32px rgba(255,255,255,0.8), 12px 32px rgba(255,255,255,0.8), 20px 32px rgba(255,255,255,0.5), 8px 36px rgba(255,255,255,0.8), 12px 36px rgba(255,255,255,0.8), 20px 36px rgba(255,255,255,0.5), 4px 40px rgba(255,255,255,0.8), 8px 40px rgba(255,255,255,0.8), 16px 40px rgba(255,255,255,0.5), 4px 44px rgba(255,255,255,0.8), 8px 44px rgba(255,255,255,0.8), 16px 44px rgba(255,255,255,0.5), 0px 48px rgba(255,255,255,0.8), 4px 48px rgba(255,255,255,0.8), 12px 48px rgba(255,255,255,0.5), 0px 52px rgba(255,255,255,0.8), 4px 52px rgba(255,255,255,0.8), 12px 52px rgba(255,255,255,0.5); }
  .btn-primary:hover:not(:disabled)::after, .btn-primary:focus-visible::after { animation: pixel-shine .6s steps(12) forwards; }
  @keyframes pixel-shine { 0% { left: -64px; opacity: 1; } 99% { opacity: 1; } 100% { left: calc(100% + 8px); opacity: 0; } }
  .btn-primary:disabled { background: var(--line); color: var(--soft); box-shadow: none; cursor: not-allowed; transform: none; }
  .btn-dark { background: var(--dark); color: #fff; }
  .btn-ghost { background: transparent; color: var(--muted); padding: 8px 0; font-weight: 600; }
  .btn-ghost:hover { color: var(--text); }
  .tag { display: inline-block; background: var(--dark); color: #fff; border-radius: 6px; padding: 4px 10px; font-size: .85rem; font-weight: 600; }
  .eyebrow { font: 700 12px/1.4 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--petrol); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  h1, h2, h3 { letter-spacing: -0.04em; line-height: 1.05; margin: 0; font-weight: 800; }

  /* Figma-Cursor */
  .cursor { display: inline-flex; align-items: flex-start; pointer-events: none; }
  .cursor svg { width: 22px; height: 22px; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  .cursor span { margin: 16px 0 0 -4px; padding: 3px 10px; border-radius: 99px; color: #fff; font-size: .8rem; font-weight: 700; white-space: nowrap; }

  /* ---------- HUD ---------- */
  .hud { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .hud .wrap { display: flex; align-items: center; gap: 16px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
  .logo { font-weight: 800; letter-spacing: -0.03em; font-size: 1.05rem; text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .logo i { font-style: italic; font-synthesis: style; letter-spacing: -0.02em; padding-right: .1em; }
  .logo b { background: var(--dark); color: #fff; border-radius: 6px; padding: 1px 6px; font-size: .8rem; }
  .hud-bar { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 12px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--petrol) 0 10px, #23917e 10px 12px); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .score { font: 700 14px "JetBrains Mono", monospace; white-space: nowrap; }
  .score em { font-style: normal; color: var(--soft); font-weight: 500; }

  /* ---------- Start ---------- */
  .start { min-height: 100vh; display: grid; place-items: center; padding: 48px 0; }
  .start-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; align-items: center; }
  .start h1 { font-size: clamp(2.3rem, 6vw, 3.6rem); margin: 18px 0 18px; }
  .start p.lead { font-size: 1.12rem; color: var(--muted); margin: 0 0 22px; max-width: 520px; }
  .rules { display: grid; gap: 10px; margin: 0 0 26px; padding: 0; list-style: none; }
  .rules li { display: flex; gap: 12px; align-items: center; }
  .rules .ico { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; }
  .field { display: grid; gap: 6px; margin: 0 0 18px; max-width: 420px; }
  .field label { font-weight: 700; font-size: .95rem; }
  .field small { color: var(--soft); font-size: .85rem; }
  input[type=text], input[type=email], input[type=url] {
    font: inherit; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); width: 100%;
  }
  input:focus { outline: none; border-color: var(--petrol); }
  input.bad { border-color: var(--red); }
  .stage { position: relative; aspect-ratio: 1 / 1; border-radius: 22px; background: var(--card); box-shadow: var(--shadow-lg); padding: 22px; overflow: hidden; }
  .stage .sky { position: absolute; inset: 0; background: linear-gradient(#EAF1FF, #fff 70%); }
  .stage .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: repeating-linear-gradient(90deg, var(--petrol) 0 24px, #187061 24px 48px); }
  .stage .ground::before { content: ""; position: absolute; left: 0; right: 0; top: -8px; height: 8px; background: #2aa38c; }
  .stage .hero { position: absolute; left: 16%; bottom: 22%; width: 26%; }
  .stage .boss { position: absolute; right: 10%; bottom: 22%; width: 34%; }
  .stage .coin { position: absolute; width: 7%; animation: bob 1.6s ease-in-out infinite; }
  .stage .vs { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font: 800 1.6rem Manrope; color: var(--red); letter-spacing: -0.04em; }
  .stage .cursor { position: absolute; }
  @keyframes bob { 50% { transform: translateY(-8px); } }

  /* ---------- Map ---------- */
  .map-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin: 36px 0 24px; flex-wrap: wrap; }
  .map-head h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-top: 8px; }
  .ready { text-align: right; }
  .ready strong { display: block; font-size: 2.6rem; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
  .ready span { color: var(--muted); font-size: .9rem; }
  .world { position: relative; border-radius: 22px; padding: 26px; background: rgba(255,255,255,.55); border: 1px dashed #d6d6d6; }
  .world-label { position: absolute; top: -12px; left: 22px; }
  .stations { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .station { position: relative; text-align: left; border: 2px solid transparent; cursor: pointer; padding: 16px; display: grid; gap: 10px; transition: transform .15s, box-shadow .2s, border-color .2s; color: var(--text); }
  .station:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .station:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .station .top { display: flex; justify-content: space-between; align-items: center; }
  .app-ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); }
  .app-ico img { width: 26px; height: 26px; }
  .app-ico .fallback { font-weight: 800; font-size: 1.2rem; }
  .pts { font: 700 13px "JetBrains Mono", monospace; padding: 3px 8px; border-radius: 6px; background: var(--yellow); color: var(--dark); }
  .station h3 { font-size: 1.15rem; letter-spacing: -0.02em; }
  .station .state { font-size: .82rem; color: var(--soft); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .station.done { border-color: var(--petrol); background: #F3FAF8; }
  .station.done .pts { background: var(--petrol); color: #fff; }
  .station.done .state { color: var(--petrol); }
  .flag { position: absolute; top: 18px; right: 68px; width: 22px; }
  .station .cursor { position: absolute; left: 70%; top: 58%; z-index: 3; }

  .boss-row { margin-top: 26px; }
  .boss-card { display: grid; grid-template-columns: 180px 1fr auto; gap: 26px; align-items: center; padding: 22px 26px; cursor: pointer; border: 2px solid var(--red); text-align: left; width: 100%; color: var(--text); position: relative; transition: transform .15s, box-shadow .2s; }
  .boss-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .boss-card .eyebrow { color: var(--red); }
  .boss-card h3 { font-size: 1.8rem; margin: 6px 0 8px; }
  .boss-card p { margin: 0; color: var(--muted); }
  .hp { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
  .hp .bar { max-width: 280px; height: 14px; }
  .hp .bar i { background: repeating-linear-gradient(90deg, var(--red) 0 10px, #d81e3f 10px 12px); }
  .boss-card .pts { background: var(--red); color: #fff; font-size: 15px; padding: 6px 12px; }
  .boss-card.defeated { border-color: var(--petrol); background: #F3FAF8; }
  .boss-card .cursor { position: absolute; left: 90px; bottom: 6px; }

  .lb-page { min-height: 100vh; display: grid; place-items: center; padding: 40px 0; }
  .lb-big { max-width: 620px; margin: 0 auto; padding: 36px 36px 30px; text-align: left; }
  .lb-big h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); margin: 8px 0 12px; }
  .lb-trophy { width: 84px; margin-bottom: 18px; animation: bob 2.4s ease-in-out infinite; }
  .lead-lb { color: var(--muted); font-size: 1.05rem; margin: 0 0 18px; }
  .lb-foot { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-top: 20px; }
  .lb-later { text-align: center; color: var(--soft); font-size: .88rem; margin-top: 14px; }
  .lb-strip { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 10px 16px; background: rgba(255,255,255,.7); border: 1px dashed #d6d6d6; border-radius: 12px; font-size: .92rem; color: var(--muted); }
  .lb-strip a { margin-left: auto; }
  .lb-mini { width: 22px; flex: none; }
  .lb-card { margin-top: 22px; padding: 20px 24px; }
  .lb-row { display: flex; gap: 18px; align-items: flex-start; }
  .lb-ico { width: 54px; flex: none; margin-top: 4px; }
  .lb-form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; max-width: 520px; }
  .lb-form input { flex: 1; min-width: 180px; }
  .lb-actions { display: flex; gap: 14px; }
  @media (max-width: 520px) { .lb-row { flex-direction: column; } .lb-ico { width: 40px; } }
  .map-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 22px 0 60px; flex-wrap: wrap; color: var(--soft); font-size: .9rem; }

  /* ---------- Aufgabe ---------- */
  .task { max-width: 760px; margin: 0 auto; padding: 28px 0 70px; }
  .emo { display: inline-block; margin-right: .3em; font-style: normal; }
  .emo-after { margin-right: 0; margin-left: .3em; }
  .privacy { display: grid; gap: 8px; max-width: 520px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 18px; font-size: .92rem; }
  .privacy small { color: var(--soft); font-size: .82rem; }
  .devlink { margin: 16px 0 0; font-size: .85rem; }
  .devlink a, .map-foot a { color: var(--soft); font-weight: 600; }
  .navrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .task-head { display: flex; gap: 18px; align-items: center; margin: 18px 0 22px; }
  .task-head .app-ico { width: 64px; height: 64px; border-radius: 16px; background: #fff; box-shadow: var(--shadow); }
  .task-head .app-ico img { width: 36px; height: 36px; }
  .task-head h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); }
  .panel { padding: 24px 26px; margin: 16px 0; }
  .panel h2 { font-size: 1.2rem; letter-spacing: -0.02em; margin-bottom: 12px; }
  .steps { margin: 0; padding-left: 22px; }
  .steps li { margin: 8px 0; }
  .steps li::marker { font-weight: 800; color: var(--petrol); }
  .note { border-radius: 10px; padding: 12px 16px; margin: 14px 0 0; font-size: .95rem; }
  .note.info { background: #EEF4FF; }
  .note.warn { background: #FEF6E0; }
  .note.danger { background: #FFEDF0; }
  .note.ok { background: #E8F5F2; }
  .code { position: relative; background: var(--dark); color: #eee; border-radius: 8px; margin: 8px 0; padding: 12px 86px 12px 14px; font: 13.5px/1.55 "JetBrains Mono", monospace; white-space: pre-wrap; word-break: break-all; }
  .copy { position: absolute; top: 8px; right: 8px; border: 0; background: var(--blue); color: #fff; border-radius: 6px; font-size: .75rem; font-weight: 700; padding: 4px 10px; cursor: pointer; }
  .check { display: flex; gap: 12px; align-items: flex-start; margin: 14px 0 0; font-weight: 600; cursor: pointer; }
  .check input { width: 22px; height: 22px; accent-color: var(--petrol); margin: 1px 0 0; flex: none; }
  .choices { display: grid; gap: 8px; margin: 6px 0 14px; }
  .choices label { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 600; background: #fff; }
  .choices label:has(input:checked) { border-color: var(--petrol); background: #F3FAF8; }
  .choices input { accent-color: var(--petrol); }
  .task-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .done-banner { display: flex; gap: 10px; align-items: center; font-weight: 700; color: var(--petrol); }
  details.help { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: #fff; }
  details.help summary { cursor: pointer; font-weight: 700; }
  details.help dt { font-weight: 700; margin-top: 10px; }
  details.help dd { margin: 2px 0 0; color: var(--muted); }
  code { font-family: "JetBrains Mono", monospace; font-size: .88em; background: #F0F0F0; padding: 1px 5px; border-radius: 4px; }
  .os-switch { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 10px; }
  .os-switch button { border: 0; background: transparent; padding: 5px 14px; border-radius: 6px; font-weight: 700; font-size: .85rem; cursor: pointer; color: var(--muted); }
  .os-switch button[aria-pressed=true] { background: var(--dark); color: #fff; }

  /* Boss */
  .boss-hero { background: var(--dark); color: #fff; border-radius: 22px; padding: 28px; display: grid; grid-template-columns: 1fr 200px; gap: 24px; align-items: center; margin: 18px 0; overflow: hidden; position: relative; }
  .boss-hero .eyebrow { color: var(--red); }
  .boss-hero h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin: 8px 0 10px; }
  .boss-hero p { margin: 0; color: #cfcfcf; }
  .boss-hero .hp .bar { background: #444; }
  .boss-hero .hp span { color: #fff; }
  .boss-hero .boss-sprite.shake { animation: shake .4s; }
  @keyframes shake { 20% { transform: translateX(-6px) rotate(-3deg); } 40% { transform: translateX(6px) rotate(3deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  .calm { background: var(--yellow); border-radius: 16px; padding: 18px 22px; font-weight: 600; margin: 16px 0; }
  .calm strong { display: block; font-size: 1.1rem; margin-bottom: 4px; letter-spacing: -0.02em; }
  .hit { border-left: 6px solid var(--line); }
  .hit.done { border-left-color: var(--petrol); }
  .hit-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .hit-head .pts { background: var(--red); color: #fff; }
  .hit.done .hit-head .pts { background: var(--petrol); }
  .hit-num { font: 700 12px "JetBrains Mono", monospace; color: var(--red); letter-spacing: .1em; }

  /* Toast */
  .toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 50; pointer-events: none; background: var(--dark); color: var(--yellow); font: 800 3rem Manrope; letter-spacing: -0.05em; padding: 18px 34px; border-radius: 18px; box-shadow: var(--shadow-lg); transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .25s; display: flex; align-items: center; gap: 14px; }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Ziel */
  .finish { text-align: center; max-width: 640px; margin: 0 auto; padding: 60px 0 80px; }
  .finish h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); margin: 14px 0; }
  .badge { width: 220px; margin: 24px auto; }
  .rank { display: inline-block; background: var(--yellow); padding: 6px 14px; border-radius: 8px; font-weight: 800; }

  @media (max-width: 860px) {
    .start-grid { grid-template-columns: 1fr; gap: 28px; }
    .stage { max-width: 420px; }
    .stations { grid-template-columns: repeat(2, 1fr); }
    .boss-card { grid-template-columns: 110px 1fr; }
    .boss-card .pts-col { grid-column: 1 / -1; }
    .boss-card .cursor { left: 90px; }
    .boss-hero { grid-template-columns: 1fr; }
    .boss-hero .boss-sprite { width: 140px; }
    .ready { text-align: left; }
  }
  @media (max-width: 420px) {
    .stations { grid-template-columns: 1fr; }
    .world { padding: 20px 14px; }
    .panel { padding: 20px 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="schema.js"></script>
<script>
/* =========================================================
   SpeedyBoarding – Konfiguration
   Punkte, Aufgaben und Texte hier anpassen.
   ========================================================= */
const ICON_CDN = "https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/";

const ANIM = {
  hero: { row: 3, gazes: ["c", "l", "r"], frames: {
    c: ["...skssks..."], l: ["...ksskss..."], r: ["...sskssk..."], b: ["...ssssss..."] } },

    b: ["rrrrrrrrrrrrrrrr", "rrrkkkrrrrkkkrrr", "rrrrrrrrrrrrrrrr"] } },
};
Object.entries(ANIM).forEach(([name, a]) => Object.entries(a.frames).forEach(([k, rows]) => {
  const v = SPRITES[name].slice(); v.splice(a.row, rows.length, ...rows); SPRITES[`${name}_${k}`] = v;
}));
const animSprite = name => `<span class="anim" data-anim="${name}">${sprite(name)}</span>`;
const rnd = () => 1000 + Math.random() * 500; // 1,0–1,5 s, unregelmäßig
function startAnims() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll("[data-anim]").forEach(el => {
    if (el._anim) return; el._anim = true;
    const a = ANIM[el.dataset.anim], name = el.dataset.anim;
    let gaze = a.gazes[0];
    const show = k => { if (el.isConnected) el.innerHTML = sprite(`${name}_${k}`); };
    const tick = () => {
      if (!el.isConnected) return;
      if (Math.random() < 0.4) { show("b"); setTimeout(() => show(gaze), 110 + Math.random() * 80); }
      else { const others = a.gazes.filter(g => g !== gaze); gaze = others[Math.floor(Math.random() * others.length)]; show(gaze); }
      setTimeout(tick, rnd());
    };
    setTimeout(tick, rnd());
  });
}

function sprite(name, cls = "") {
  const rows = SPRITES[name], h = rows.length, w = rows[0].length;
  let r = "";
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (c !== ".") r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`; }));
  return `<svg class="pixel ${cls}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${r}</svg>`;
}
function cursor(label, color = "var(--red)") {
  return `<span class="cursor"><svg viewBox="0 0 24 24"><path d="M3 2l17 8.5-7.2 1.8L9.5 20z" fill="${color}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><span style="background:${color}">${esc(label)}</span></span>`;
}
function appIcon(t) {
  return `<span class="app-ico"><img src="${ICON_CDN}${t.icon}.svg" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:'${t.name[0]}'}))"></span>`;
}

/* Nächste offene Aufgabe nach der aktuellen (in Map-Reihenfolge), am Ende der Boss */
function nextStop(current) {
  const order = [...TASKS.map(t => t.id), "github"];
  const open = id => id === "github" ? bossHits().length < BOSS.hits.length : !taskDone(id);
  const i = order.indexOf(current);
  for (let k = 1; k < order.length; k++) { const id = order[(i + k) % order.length]; if (open(id)) return id; }
  return null;
}
function navRow(current) {
  const n = nextStop(current);
  const right = n
    ? `<button class="btn btn-ghost" type="button" data-go="${n === "github" ? "#boss" : "#task/" + n}">${n === "github" ? "Zum Endboss" : "<span class='emo'>📋</span>Nächste Aufgabe: " + TASKS.find(t => t.id === n).name} →</button>`
    : (score() === MAX ? `<button class="btn btn-ghost" type="button" data-go="#finish">Zum Ziel<span class="emo emo-after">🏆</span></button>` : "");
  return `<nav class="navrow"><button class="btn btn-ghost" type="button" data-go="#map">← <span class="emo">🗺️</span>Zurück zur Map</button>${right}</nav>`;
}

        <label><input type="radio" name="g" value="none" ${g === "none" ? "checked" : ""}> Nein, noch nicht</label>
      </div>
      <div id="gnone" ${g === "none" ? "" : "hidden"}>
        <ol class="steps">
          <li><a href="https://accounts.google.com/signup" target="_blank" rel="noopener">accounts.google.com/signup</a> öffnen und Vor- und Nachnamen eingeben.</li>
          <li>Bei der Frage nach der E-Mail-Adresse auf <strong>„Stattdessen meine aktuelle E-Mail-Adresse verwenden“</strong> klicken. So brauchst du kein Gmail-Postfach.</li>
          <li>Deine bestehende Adresse eingeben, den Bestätigungscode aus deinem Postfach eintragen und fertig.</li>
        </ol>
        <div class="note info"><span class="emo">💡</span>Lieber ein Gmail-Postfach? Geht natürlich auch – dann einfach eine neue Gmail-Adresse wählen.</div>
      </div>
      <div class="note warn"><span class="emo">⚠️</span>Bitte <strong>keine Arbeits-Adresse</strong> deines aktuellen Arbeitgebers. Die kann Kurse blockieren, und bei einem Jobwechsel ist der Zugang weg.</div>
    </div>` : `
    <div class="card panel">
      <h2>So geht's</h2>
      <ol class="steps">${t.steps.map(s => `<li>${s}</li>`).join("")}</ol>
    </div>`;
  return `${hud()}<main class="wrap"><div class="task">
    ${navRow(t.id)}
    <div class="task-head">${appIcon(t)}<div><span class="eyebrow"><span class="emo">📋</span>Aufgabe · +${t.points} Punkte</span><h1>${t.name}</h1></div></div>
    <p style="font-size:1.08rem;color:var(--muted);margin:0">${t.why}</p>
    ${body}
    <div class="card panel">
      <h2>Deine Angabe</h2>
      ${emailField(t)}
      <label class="check"><input type="checkbox" id="tconfirm" ${done ? "checked" : ""}> ${t.google ? "Ich habe ein Google-Konto mit dieser Adresse." : `Ich habe einen ${esc(t.name)}-Account bzw. nutze diese Adresse für ${esc(t.name)}.`}</label>
      <div class="task-actions">
        ${done ? `<span class="done-banner">✓ Erledigt · +${t.points} Punkte</span>` : "<span></span>"}
        <button class="btn btn-primary" id="tdone" type="button">${done ? "Speichern & zur Map" : `Erledigt · +${t.points}`}</button>
      </div>
    </div>
  </div></main>`;
}

function hitPanel(h, i, inner) {
  const done = !!(state.boss[h.id] && state.boss[h.id].done);
  return `<section class="card panel hit${done ? " done" : ""}" id="hit-${h.id}">
    <div class="hit-head"><div><div class="hit-num">TREFFER ${i + 1}/4</div><h2 style="margin:4px 0 0">${h.title}</h2></div><span class="pts">${done ? "✓ " : ""}+${h.points}</span></div>
    ${inner}
    <div class="task-actions">
      <span>${done ? `<span class="done-banner">✓ Treffer gelandet!</span>` : ""}</span>
      <button class="btn ${done ? "btn-ghost" : "btn-primary"}" type="button" data-hit="${h.id}">${done ? "Rückgängig" : `Treffer! +${h.points}`}</button>
    </div>
  </section>`;
}

function viewBoss() {
  const hits = bossHits().length, mac = state.os === "mac";
  const user = (state.boss.account && state.boss.account.user) || "";
  const H = BOSS.hits;
  return `${hud()}<main class="wrap"><div class="task">
    ${navRow("github")}
    <div class="boss-hero">
      <div>
        <span class="eyebrow">Endboss · +100 Punkte</span>
        <h1>GitHub</h1>
        <p>Hier kommt dein Code ins Netz. Vier Treffer, und der Boss liegt am Boden.</p>
        <div class="hp"><span class="mono" style="font-size:12px;font-weight:700">HP</span><div class="bar"><i style="width:${100 - hits * 25}%"></i></div><span class="mono" style="font-size:12px">${hits}/4</span></div>
      </div>
      <div class="boss-sprite" id="bossSprite" style="position:relative">${hits === 4 ? sprite("bossDown") : animSprite("boss")}</div>
    </div>
    <div class="calm">
      <strong>Fehler passieren hier – alles easy.<span class="emo emo-after">🙌</span></strong>
      Fragt eure KI des Vertrauens. Wenn etwas nicht gleich funktioniert, probiert es nochmal – oder macht erst mit der nächsten Aufgabe weiter und kommt später zurück.
    </div>
    <details class="help"><summary><span class="emo">🤖</span>Joker: Fertiger Prompt für deine KI</summary>${codeBox(AI_PROMPT)}<div class="note danger" style="margin-top:8px"><span class="emo">🔒</span>Niemals deinen Token in einen Chat kopieren – auch nicht in eine KI.</div></details>

    ${hitPanel(H[0], 0, `
      <ol class="steps">
        <li>Auf <a href="https://github.com/signup" target="_blank" rel="noopener">github.com/signup</a> registrieren, den <strong>Free</strong>-Plan wählen und deine E-Mail bestätigen. Schon einen Account? Super, weiter mit 2.</li>
        <li>Auf github.com oben rechts auf dein Profilbild → <strong>Your profile</strong>. Den Link aus der Adresszeile kopieren.</li>
      </ol>
      <div class="field" style="max-width:none;margin-top:14px">
        <label for="ghuser">Dein GitHub-Profil-Link oder Benutzername</label>
        <input id="ghuser" type="text" autocomplete="off" spellcheck="false" placeholder="https://github.com/dein-name" value="${user ? "https://github.com/" + esc(user) : ""}">
        <small id="ghhint">${user ? `✓ Benutzername: <strong>${esc(user)}</strong>` : "Link oder nur den Namen – beides geht."}</small>
      </div>`)}

    ${hitPanel(H[1], 1, `
      <p style="margin:0 0 10px">Git ist das Programm, das deinen Code zu GitHub bringt. Das Terminal hat jeder Rechner – Git aber nicht.</p>
      ${osSwitch()}
      ${mac ? `
        <ol class="steps">
          <li>Terminal öffnen: <strong>⌘ + Leertaste</strong>, „Terminal“ tippen, Enter.</li>
          <li>Prüfen, ob Git schon da ist:${codeBox("git --version")}Zeigt es eine Versionsnummer? Dann bist du fertig – Treffer!</li>
          <li>Sonst installieren:${codeBox("xcode-select --install")}Im Fenster auf <strong>„Installieren“</strong> klicken – <strong>nicht</strong> auf „Xcode laden“ (über 10 GB, brauchst du nicht).</li>
          <li>Warten, bis <strong>„Die Software wurde installiert“</strong> erscheint. Das kann bis zu 45 Minuten dauern. Nicht auf „Stoppen“ klicken.</li>
          <li>Nochmal <code>git --version</code> eingeben – jetzt sollte eine Version erscheinen.</li>
        </ol>
        <div class="note info"><span class="emo">💡</span>Homebrew ist keine Abkürzung – es lädt genau dasselbe Paket.</div>` : `
        <ol class="steps">
          <li><a href="https://git-scm.com/download/win" target="_blank" rel="noopener">Git for Windows</a> herunterladen.</li>
          <li>Installer ausführen, alle Standardeinstellungen lassen.</li>
          <li>PowerShell öffnen (Start → „PowerShell“) und prüfen:${codeBox("git --version")}</li>
        </ol>
        <div class="note info"><span class="emo">💡</span>„git is not recognized“? PowerShell schließen und neu öffnen.</div>`}
      <p style="margin:14px 0 6px">Einmalig deinen Namen setzen (sonst gibt's beim ersten Commit einen Fehler):</p>
      ${codeBox(`git config --global user.name "${state.name || "Dein Name"}"\ngit config --global user.email "${state.email || "deine@email.de"}"`)}`)}

    ${hitPanel(H[2], 2, `
      <p style="margin:0 0 10px">Beim Hochladen fragt Git nach einem Passwort. Dein GitHub-Passwort funktioniert dort <strong>nicht</strong> – du brauchst einen <strong>Token</strong>.</p>
      <ol class="steps">
        <li>Bei github.com eingeloggt sein, dann <a href="https://github.com/settings/tokens/new?scopes=repo&description=PM%20Bootcamp" target="_blank" rel="noopener"><strong>diesen Link öffnen</strong></a>. Er füllt das Formular schon vor.</li>
        <li><strong>„Confirm access“:</strong> Code aus der E-Mail von GitHub eingeben (Spam-Ordner prüfen!), dann <strong>Verify</strong>.</li>
        <li><strong>Expiration</strong> auf <strong>90 days</strong> stellen (GitHub schlägt jedes Mal 30 vor). <strong>Nicht</strong> „No expiration“.</li>
        <li>Bei <strong>Select scopes</strong> nur <code>repo</code> angehakt lassen, sonst nichts.</li>
        <li>Ganz unten <strong>Generate token</strong> klicken und den Token (<code>ghp_…</code>) mit dem Kopier-Symbol kopieren.</li>
        <li>Die Seite offen lassen, bis Treffer 4 geschafft ist – der Token wird nur einmal angezeigt.</li>
      </ol>
      <div class="note danger"><span class="emo">🔒</span>Der Token ist wie ein Passwort: nie in Slack, Chats, KI-Tools, Screenshots oder Dateien – und auch <strong>nicht hier</strong> eintragen.</div>`)}

    ${hitPanel(H[3], 3, `
      <p style="margin:0 0 10px">Jetzt lädst du zum ersten Mal etwas hoch. Am einfachsten lässt du Claude die Vorarbeit machen.</p>
      <ol class="steps">
        <li>Auf github.com oben rechts <strong>+ → New repository</strong>, Name <code>hello-bootcamp</code>, <strong>Create repository</strong>.</li>
        <li>In der Claude-App (Code-Tab) diesen Auftrag geben:${codeBox(`Leg einen Ordner hello-bootcamp mit einer README an, mach einen ersten Commit und richte github.com/${user || "DEIN-NAME"}/hello-bootcamp als Remote ein. Trag meinen GitHub-Benutzernamen in die Remote-URL ein. Den Push mache ich selbst im Terminal.`)}</li>
        <li>Claude nennt dir den Push-Befehl. Im Terminal ausführen – <strong>erst dann</strong> erscheint:${codeBox(`Password for 'https://${user || "DEIN-NAME"}@github.com':`)}</li>
        <li>Jetzt den Token einfügen (${mac ? "<strong>Cmd + V</strong>" : "<strong>Rechtsklick</strong>"}) und <strong>Enter</strong>.</li>
      </ol>
      <div class="note warn"><span class="emo">⚠️</span><strong>Token nur einfügen, wenn <code>Password for …</code> dasteht.</strong> Steht am Zeilenanfang <code>${mac ? "name@Mac ~ %" : "PS C:\\Users\\name&gt;"}</code>, wartet das Terminal auf einen Befehl – dort nicht einfügen!</div>
      <div class="note info"><span class="emo">👀</span><strong>Beim Einfügen erscheint nichts</strong> – keine Punkte, keine Sternchen. Das ist richtig so.</div>
      <div class="note ok"><span class="emo">✅</span>Geschafft, wenn am Ende steht:${codeBox("* [new branch]      main -> main\nbranch 'main' set up to track 'origin/main'.")}</div>
      <details class="help"><summary>Es klappt nicht?</summary><dl>
        <dt>Ich sehe den Token auf dem Bildschirm</dt><dd>Er ist in der falschen Zeile. <strong>Nicht Enter drücken.</strong> Ctrl + C, dann <code>clear</code>. Token auf GitHub löschen und einen neuen erstellen – ein sichtbarer Token gilt als verbraucht.</dd>
        <dt><code>fatal: not a git repository</code></dt><dd>Falscher Ordner. Erst mit <code>cd</code> in den Projektordner wechseln – oder Claude fragen, welcher Befehl passt.</dd>
        <dt><code>Username for 'https://github.com':</code></dt><dd>Der Benutzername fehlt in der Remote-URL. Claude bitten, ihn einzutragen – oder den Namen <strong>tippen</strong>, Enter, und erst bei <code>Password</code> den Token einfügen.</dd>
        <dt><code>Authentication failed</code></dt><dd>Token falsch, abgelaufen oder ohne <code>repo</code>. Neuen Token erstellen (Treffer 3) und nochmal pushen.</dd>
        <dt><code>Repository not found</code></dt><dd>Repo auf GitHub noch nicht angelegt oder anders geschrieben.</dd>
        <dt>Die Passwort-Frage kommt doppelt</dt><dd>Zwei Versuche laufen gleichzeitig. Ctrl + C (ggf. zweimal), <code>clear</code>, dann einmal neu starten.</dd>
      </dl></details>`)}
  </div></main>`;
}

function viewFinish() {
  return `${hud()}<main class="wrap"><div class="finish">
    <div class="badge">${sprite("trophy")}</div>
    <span class="eyebrow">${score()} / ${MAX} Punkte</span>
    <h1>${esc(firstName())}, du bist bereit!</h1>
    <p><span class="rank">${rank()}</span></p>
    <p style="color:var(--muted);font-size:1.1rem">Alle Werkzeuge sind eingerichtet und der Endboss liegt am Boden. Wir freuen uns auf die erste Session mit dir.</p>
    <p style="margin-top:26px"><button class="btn btn-primary" type="button" data-copy="Ich bin AI-Powered-PM-ready! 🏆 ${score()}/${MAX} Punkte im SpeedyBoarding – GitHub-Endboss besiegt.">Für Slack kopieren<span class="emo emo-after">📋</span></button></p>
    <p><button class="btn btn-ghost" type="button" data-go="#map">← <span class="emo">🗺️</span>Zurück zur Map</button></p>
  </div></main>`;
}

/* ---------- Router ---------- */
const app = document.getElementById("app");
function route() {
  let h = location.hash || "#start";
  if (!(state.consent && state.consent.accepted)) h = "#start"; // ohne Datenschutz-Haken geht es nicht weiter
  if (h.startsWith("#task/")) { app.innerHTML = viewTask(h.slice(6)); state.last = h.slice(6); }
  else if (h === "#map") app.innerHTML = viewMap();
  else if (h === "#boss") { app.innerHTML = viewBoss(); state.last = "github"; }
  else if (h === "#finish") app.innerHTML = viewFinish();
  else if (h === "#leaderboard") app.innerHTML = viewLeaderboard();
  else app.innerHTML = viewStart();
  save();
  window.scrollTo(0, 0);
  bind();
  startAnims();
}
function go(h) { if (location.hash === h) route(); else location.hash = h; }

function toast(text) {
  const t = document.getElementById("toast");
  t.innerHTML = `<span style="width:44px">${sprite("coin")}</span>${text}`;
  t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1100);
}

function parseGitHub(v) {
  v = v.trim().replace(/\/+$/, "");
  const m = v.match(/^(?:https?:\/\/)?(?:www\.)?github\.com\/([^\/?#\s]+)/i);
  const name = m ? m[1] : v.replace(/^@/, "");
  return /^[a-z\d](?:[a-z\d]|-(?=[a-z\d])){0,38}$/i.test(name) ? name : null;
}

function bind() {
  const mail = document.getElementById("mail");
  const goBtn = document.getElementById("go");
  const priv = document.getElementById("privacy");
  if (goBtn) {
    const upd = () => { goBtn.disabled = !priv.checked; };
    priv.onchange = upd; upd();
    goBtn.onclick = () => {
      const v = mail.value.trim();
      if (v && !validEmail(v)) { mail.classList.add("bad"); mail.focus(); return; }
      if (!priv.checked) return;
      if (!(state.consent && state.consent.accepted)) state.consent = { accepted: true, at: new Date().toISOString(), policyUrl: "https://school.digitale-leute.de/datenschutz" };
      state.email = v; save(); go(state.leaderboard && state.leaderboard.seen ? "#map" : "#leaderboard");
    };
  }

  // Aufgabe
  const tdone = document.getElementById("tdone");
  if (tdone) {
    const id = location.hash.slice(6), t = TASKS.find(x => x.id === id);
    const tm = document.getElementById("tmail"), tc = document.getElementById("tconfirm");
    const ok = () => validEmail(tm.value.trim()) && tc.checked && (!t.google || document.querySelector('input[name=g]:checked'));
    const upd = () => { tdone.disabled = !ok(); tm.classList.toggle("bad", !!tm.value.trim() && !validEmail(tm.value.trim())); };
    tm.oninput = upd; tc.onchange = upd;
    document.querySelectorAll("input[name=g]").forEach(r => r.onchange = () => {
      document.getElementById("gnone").hidden = r.value !== "none";
      state.tasks.google = Object.assign(state.tasks.google || {}, { has: r.value }); save(); upd();
    });
    upd();
    tdone.onclick = () => {
      if (!ok()) return;
      const was = taskDone(id);
      state.tasks[id] = Object.assign(state.tasks[id] || {}, { done: true, email: tm.value.trim() });
      if (!state.email) state.email = tm.value.trim();
      save();
      if (!was) toast(`+${t.points}!`);
      setTimeout(() => go("#map"), was ? 0 : 900);
    };
  }

  // Boss
  const gh = document.getElementById("ghuser");
  if (gh) gh.oninput = () => {
    const n = parseGitHub(gh.value);
    document.getElementById("ghhint").innerHTML = n ? `✓ Benutzername: <strong>${esc(n)}</strong>` : (gh.value.trim() ? "Das sieht noch nicht nach einem GitHub-Profil aus." : "Link oder nur den Namen – beides geht.");
    gh.classList.toggle("bad", !!gh.value.trim() && !n);
  };
  document.querySelectorAll("[data-hit]").forEach(b => b.onclick = () => {
    const id = b.dataset.hit, h = BOSS.hits.find(x => x.id === id);
    const cur = state.boss[id] && state.boss[id].done;
    if (cur) { state.boss[id] = Object.assign(state.boss[id], { done: false }); save(); route(); document.getElementById("hit-" + id).scrollIntoView({ block: "center" }); return; }
    if (id === "account") {
      const n = parseGitHub(gh.value);
      if (!n) { gh.classList.add("bad"); gh.focus(); document.getElementById("ghhint").textContent = "Bitte zuerst deinen Profil-Link oder Benutzernamen eintragen."; return; }
      state.boss.account = { done: true, user: n };
    } else state.boss[id] = { done: true };
    save();
    const sp = document.getElementById("bossSprite"); sp.classList.add("shake");
    toast(`+${h.points}!`);
    setTimeout(() => {
      if (bossHits().length === BOSS.hits.length) { go("#map"); return; }
      route();
      const nextHit = BOSS.hits.find(x => !(state.boss[x.id] && state.boss[x.id].done));
      const el = document.getElementById("hit-" + (nextHit ? nextHit.id : id));
      if (el) el.scrollIntoView({ block: "start" });
    }, 900);
  });

  // Leaderboard
  const gn = document.getElementById("gn");
  if (gn) {
    const ok = document.getElementById("lbOk"), join = document.getElementById("lbJoin"), hint = document.getElementById("gnHint");
    const realParts = (state.name || "").toLowerCase().split(/\s+/).filter(x => x.length > 2);
    const check = () => {
      const v = gn.value.trim(), valid = SB.validGamerName(v), real = realParts.some(x => v.toLowerCase().includes(x));
      gn.classList.toggle("bad", !!v && (!valid || real));
      hint.textContent = real ? "Das sieht nach deinem echten Namen aus. Wähl lieber einen Fantasienamen." : "3–20 Zeichen: Buchstaben, Ziffern, Leerzeichen, _ und -. Bitte nicht deinen echten Namen.";
      join.disabled = !(valid && !real && ok.checked);
    };
    gn.oninput = () => { state.leaderboard = Object.assign(state.leaderboard || {}, { draft: gn.value }); save(); check(); };
    ok.onchange = check;
    document.getElementById("gnDice").onclick = () => { gn.value = randomGamerName(); gn.oninput(); };
    join.onclick = () => {
      state.leaderboard = { optIn: true, gamerName: gn.value.trim(), at: new Date().toISOString(), seen: true };
      save(); toast("🏆"); setTimeout(() => go("#map"), 800);
    };
    check();
  }
  const lbSkip = document.getElementById("lbSkip");
  if (lbSkip) lbSkip.onclick = () => { state.leaderboard = Object.assign(state.leaderboard || {}, { optIn: false, seen: true }); save(); go("#map"); };
  const lbOut = document.getElementById("lbOut");
  if (lbOut) {
    lbOut.onclick = () => { state.leaderboard = { optIn: false, draft: state.leaderboard.gamerName, seen: true }; save(); route(); };
    document.getElementById("lbEdit").onclick = () => { state.leaderboard = { optIn: false, draft: state.leaderboard.gamerName, seen: true }; save(); route(); document.getElementById("gn").focus(); };
  }

  // Allgemein
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-os]").forEach(b => b.onclick = () => { state.os = b.dataset.os; save(); const y = scrollY; route(); scrollTo(0, y); });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    navigator.clipboard?.writeText(b.dataset.copy).then(() => { const o = b.textContent; b.textContent = "Kopiert ✓"; setTimeout(() => b.textContent = o, 1400); }).catch(() => {});
  });
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
